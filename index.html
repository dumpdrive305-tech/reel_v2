<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MyReels"/>
<title>MyReels</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --red: #ff2442;
    --blue: #229ED9;
    --bg: #0a0a0a;
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.4);
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:var(--font-display); overflow:hidden; touch-action:none; }

  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.3s, transform 0.3s; }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(0.97); }
  div.hidden { display:none; }

  /* ── AUTH SCREEN ── */
  #auth { background:var(--bg); overflow-y:auto; touch-action:pan-y; justify-content:flex-start; }
  .auth-inner { width:100%; max-width:400px; min-height:100%; padding:0 28px 48px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto; }
  .auth-logo { font-size:48px; font-weight:800; letter-spacing:-2px; background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.6) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:4px; margin-top:60px; }
  .auth-logo span { -webkit-text-fill-color:var(--red); }
  .auth-tagline { font-family:var(--font-mono); font-size:10px; letter-spacing:0.25em; color:var(--muted); text-transform:uppercase; margin-bottom:48px; }
  .auth-tabs { display:flex; gap:0; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:14px; padding:4px; width:100%; margin-bottom:28px; }
  .auth-tab { flex:1; height:38px; border:none; border-radius:10px; font-family:var(--font-display); font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:var(--muted); transition:all 0.2s; }
  .auth-tab.active { background:var(--blue); color:#fff; }
  .auth-form { width:100%; display:flex; flex-direction:column; gap:12px; }
  .auth-field { display:flex; flex-direction:column; gap:6px; }
  .auth-label { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; color:var(--muted); text-transform:uppercase; }
  .auth-input { width:100%; height:52px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:14px; padding:0 16px; color:#fff; font-family:var(--font-mono); font-size:14px; outline:none; transition:border-color 0.2s; -webkit-appearance:none; }
  .auth-input:focus { border-color:var(--blue); }
  .auth-input::placeholder { color:rgba(255,255,255,0.2); }
  .auth-error { background:rgba(255,36,66,0.08); border:1px solid rgba(255,36,66,0.2); border-radius:12px; padding:12px 16px; font-size:12px; color:#ff6b6b; line-height:1.6; text-align:center; display:none; font-family:var(--font-mono); }
  .auth-error.visible { display:block; }
  .auth-success { background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.2); border-radius:12px; padding:12px 16px; font-size:12px; color:#4ade80; line-height:1.6; text-align:center; display:none; font-family:var(--font-mono); }
  .auth-success.visible { display:block; }
  .btn-auth { width:100%; height:54px; border:none; border-radius:16px; font-family:var(--font-display); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:transform 0.15s, opacity 0.15s; margin-top:4px; }
  .btn-auth:active { transform:scale(0.97); opacity:0.85; }
  .btn-auth.primary { background:var(--blue); color:#fff; }
  .btn-auth.ghost { background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--muted); font-size:13px; height:46px; margin-top:0; }
  .btn-auth.ghost:active { color:#fff; }
  .auth-divider { display:flex; align-items:center; gap:12px; width:100%; }
  .auth-divider-line { flex:1; height:1px; background:var(--border); }
  .auth-divider-text { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.2); letter-spacing:0.1em; }
  .auth-spinner { width:20px; height:20px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
  .auth-note { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.15); text-align:center; line-height:1.8; margin-top:8px; }

  /* ── CONFIG SCREEN (PAT setup) ── */
  #configScreen { background:var(--bg); overflow-y:auto; touch-action:pan-y; justify-content:flex-start; }
  .config-inner { width:100%; max-width:400px; min-height:100%; padding:56px 28px 48px; display:flex; flex-direction:column; margin:0 auto; }
  .config-header { display:flex; align-items:center; gap:14px; margin-bottom:32px; }
  .config-title { font-size:20px; font-weight:800; }
  .config-desc { font-family:var(--font-mono); font-size:11px; color:var(--muted); line-height:1.8; margin-bottom:24px; }
  .config-steps { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:24px; }
  .config-steps-title { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.1em; }
  .config-steps ol { padding-left:16px; color:rgba(255,255,255,0.4); font-size:11px; font-family:var(--font-mono); line-height:2.2; }
  .config-steps ol li span { color:var(--blue); }

  /* ── SPLASH ── */
  #splash { background:var(--bg); }
  .splash-bg { position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,36,66,0.12) 0%, transparent 70%), radial-gradient(ellipse 60% 40% at 80% 100%, rgba(34,158,217,0.08) 0%, transparent 60%); pointer-events:none; }
  .splash-logo { margin-bottom:6px; font-size:52px; font-weight:800; letter-spacing:-2px; background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.6) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; position:relative; z-index:1; }
  .splash-logo span { -webkit-text-fill-color:var(--red); }
  .splash-sub { font-family:var(--font-mono); font-size:10px; letter-spacing:0.25em; color:var(--muted); margin-bottom:16px; text-transform:uppercase; position:relative; z-index:1; }
  .splash-user-badge { font-family:var(--font-mono); font-size:11px; color:rgba(255,255,255,0.3); margin-bottom:40px; position:relative; z-index:1; display:flex; align-items:center; gap:6px; }
  .splash-user-badge span { color:var(--blue); font-weight:700; }
  .splash-buttons { display:flex; flex-direction:column; gap:12px; width:100%; padding:0 32px; position:relative; z-index:1; }
  .splash-buttons.loading-active { display:none; }
  .btn-main { width:100%; height:56px; border:none; border-radius:18px; font-family:var(--font-display); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:transform 0.15s, opacity 0.15s; }
  .btn-main:active { transform:scale(0.97); opacity:0.9; }
  .btn-telegram { background:var(--blue); color:#fff; }
  .btn-tg-row { display:flex; gap:10px; width:100%; }
  .btn-tg-row .btn-main { flex:1; }
  .btn-gear-inline { width:56px; flex-shrink:0; background:rgba(34,158,217,0.15); border:1px solid rgba(34,158,217,0.3); border-radius:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.2s; }
  .btn-gear-inline:active { background:rgba(34,158,217,0.25); }
  .btn-gear-inline svg { width:20px; height:20px; stroke:var(--blue); }
  .btn-logout { width:100%; height:44px; border:1px solid rgba(255,255,255,0.08); border-radius:14px; background:transparent; color:rgba(255,255,255,0.3); font-family:var(--font-display); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.2s; }
  .btn-logout:active { color:#fff; border-color:rgba(255,255,255,0.2); }
  .splash-hint { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.18); text-align:center; margin-top:32px; line-height:1.8; position:relative; z-index:1; }
  .splash-loading { display:none; flex-direction:column; align-items:center; gap:14px; position:relative; z-index:1; }
  .splash-loading.active { display:flex; }
  .spinner { width:36px; height:36px; border:2px solid rgba(255,255,255,0.1); border-top-color:var(--blue); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-label { font-family:var(--font-mono); font-size:12px; color:var(--muted); letter-spacing:0.1em; }
  .error-box { background:rgba(255,36,66,0.08); border:1px solid rgba(255,36,66,0.2); border-radius:14px; padding:16px 20px; font-size:13px; color:#ff6b6b; line-height:1.6; text-align:center; max-width:300px; display:none; margin-top:16px; position:relative; z-index:1; white-space:pre-line; }
  .error-box.visible { display:block; }

  /* ── HOME SCREEN ── */
  #home { background:var(--bg); justify-content:flex-start; overflow-y:auto; touch-action:pan-y; }
  .home-inner { width:100%; max-width:480px; min-height:100%; display:flex; flex-direction:column; margin:0 auto; }
  .home-header { padding:56px 20px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .home-brand { display:flex; flex-direction:column; gap:2px; }
  .home-logo { font-size:24px; font-weight:800; letter-spacing:-1px; }
  .home-logo span { color:var(--red); }
  .home-user { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .home-user b { color:var(--blue); font-weight:400; }
  .home-logout { width:36px; height:36px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.2s; }
  .home-logout:active { background:rgba(255,255,255,0.1); }
  .home-logout svg { width:16px; height:16px; stroke:var(--muted); }
  .home-list { flex:1; padding:8px 0; }
  .session-item { display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; transition:background 0.15s; border-bottom:1px solid rgba(255,255,255,0.04); }
  .session-item:active { background:rgba(255,255,255,0.05); }
  .session-avatar { width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg, var(--blue), #1a7bbf); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#fff; flex-shrink:0; }
  .session-avatar.red { background:linear-gradient(135deg, var(--red), #c0001c); }
  .session-avatar.green { background:linear-gradient(135deg, #22c55e, #15803d); }
  .session-avatar.purple { background:linear-gradient(135deg, #a855f7, #7c3aed); }
  .session-avatar.orange { background:linear-gradient(135deg, #f97316, #c2410c); }
  .session-info { flex:1; min-width:0; }
  .session-name { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-chat { font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-top:3px; }
  .session-btn.refresh svg { stroke:var(--blue); }
  .session-btn.share svg { stroke:#2ecc71; }
  .session-btn.gear svg { stroke:var(--muted); }
  .upload-progress-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:999; display:flex; align-items:center; justify-content:center; }
  .upload-progress-box { background:#161616; border:1px solid #2a2a2a; border-radius:16px; padding:24px; width:80%; max-width:320px; text-align:center; font-size:14px; color:#eee; }
  .upload-progress-bar { margin-top:14px; height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden; }
  .upload-progress-fill { height:100%; width:0%; background:var(--blue,#2ecc71); transition:width 0.2s; }
  .user-row { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .user-row-top { display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  .user-row-pass { font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .user-row-groups { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .user-group-chip { background:rgba(46,204,113,0.12); color:#2ecc71; border:1px solid rgba(46,204,113,0.3); border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .user-row-share-btn { margin-top:10px; width:100%; background:none; border:1px dashed var(--border); color:var(--muted); border-radius:10px; padding:8px; font-size:12px; cursor:pointer; }
  .admin-settings-box { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:24px; }
  .user-row-expanded { padding-top:4px; }
  .btn-save.small { padding:10px; font-size:13px; margin-top:8px; }
  .user-row-delete-btn { margin-top:10px; width:100%; background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.3); color:#ff6b6b; border-radius:10px; padding:8px; font-size:12px; cursor:pointer; }
  .session-actions { display:flex; gap:6px; }
  .session-btn { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background 0.15s; }
  .session-btn:active { background:rgba(255,255,255,0.1); }
  .session-btn svg { width:15px; height:15px; }
  .session-btn.edit svg { stroke:var(--muted); }
  .session-btn.del svg { stroke:#ff6b6b; }
  .home-empty { padding:60px 32px; text-align:center; color:var(--muted); font-family:var(--font-mono); font-size:12px; line-height:2; }
  .home-empty-icon { font-size:40px; margin-bottom:16px; opacity:0.4; }
  .home-footer { padding:20px; border-top:1px solid var(--border); }
  .btn-add-group { width:100%; height:56px; background:var(--blue); border:none; border-radius:18px; color:#fff; font-family:var(--font-display); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:transform 0.15s, opacity 0.15s; }
  .btn-add-group:active { transform:scale(0.97); opacity:0.85; }
  .btn-add-group svg { width:18px; height:18px; stroke:#fff; }
  .home-loading { display:none; flex-direction:column; align-items:center; gap:14px; padding:40px; }
  .home-loading.active { display:flex; }
  .home-error { background:rgba(255,36,66,0.08); border:1px solid rgba(255,36,66,0.2); border-radius:14px; padding:14px 18px; font-size:12px; color:#ff6b6b; line-height:1.6; text-align:center; display:none; margin:16px 20px; font-family:var(--font-mono); white-space:pre-line; }
  .home-error.visible { display:block; }

  /* ── SETTINGS ── */
  #settings { background:var(--bg); justify-content:flex-start; padding:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  #adminUsers { background:var(--bg); justify-content:flex-start; padding:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  .settings-inner { width:100%; max-width:480px; padding:56px 28px 48px; min-height:100%; display:flex; flex-direction:column; }
  .settings-header { display:flex; align-items:center; gap:14px; margin-bottom:36px; }
  .btn-back { width:40px; height:40px; background:rgba(255,255,255,0.06); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background 0.2s; }
  .btn-back:active { background:rgba(255,255,255,0.1); }
  .btn-back svg { width:18px; height:18px; stroke:#fff; }
  .settings-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .field-label { font-family:var(--font-mono); font-size:10px; letter-spacing:0.18em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; margin-top:20px; }
  .field-input { width:100%; height:52px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:14px; padding:0 16px; color:#fff; font-family:var(--font-mono); font-size:14px; outline:none; transition:border-color 0.2s; -webkit-appearance:none; }
  .field-input:focus { border-color:var(--blue); }
  .field-input::placeholder { color:rgba(255,255,255,0.2); }
  .field-hint { font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.2); margin-top:6px; line-height:1.7; }
  .settings-error { color:#ff6b6b; font-size:13px; margin-top:12px; display:none; line-height:1.5; }
  .settings-error.visible { display:block; }
  .btn-save { margin-top:28px; width:100%; height:54px; background:var(--blue); border:none; border-radius:16px; color:#fff; font-family:var(--font-display); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity 0.15s, transform 0.15s; }
  .btn-save:active { transform:scale(0.97); opacity:0.85; }
  .settings-guide { margin-top:32px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:16px; padding:18px 20px; }
  .settings-guide-title { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:0.1em; }
  .settings-guide ol { padding-left:16px; color:rgba(255,255,255,0.3); font-size:12px; font-family:var(--font-mono); line-height:2; }

  /* ── RENAME MODAL ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:60; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal-box { background:#161616; border:1px solid var(--border); border-radius:24px 24px 0 0; width:100%; max-width:480px; padding:28px 24px 40px; transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94); }
  .modal-overlay.open .modal-box { transform:translateY(0); }
  .modal-title { font-size:16px; font-weight:800; margin-bottom:18px; }
  .modal-input { width:100%; height:50px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:13px; padding:0 16px; color:#fff; font-family:var(--font-display); font-size:15px; font-weight:600; outline:none; -webkit-appearance:none; }
  .modal-input:focus { border-color:var(--blue); }
  .modal-btns { display:flex; gap:10px; margin-top:16px; }
  .modal-btn { flex:1; height:48px; border:none; border-radius:13px; font-family:var(--font-display); font-size:14px; font-weight:700; cursor:pointer; transition:opacity 0.15s; }
  .modal-btn.cancel { background:rgba(255,255,255,0.08); color:#fff; }
  .modal-btn.confirm { background:var(--blue); color:#fff; }
  .modal-btn:active { opacity:0.8; }

  /* ── PLAYER ── */
  #player { background:#000; touch-action:none; }
  .video-slot { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .video-slot video { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .video-slot video.fit-cover { object-fit:cover; }
  .video-slot.hidden { display:none; }
  /* On PC wide screens, limit player width so portrait videos don't stretch */
  @media (min-width: 600px)
